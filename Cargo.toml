[package]
name = "less-is-more"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
derive_more = { version = "2.1", features = ["display", "add", "add_assign", "sum"] }
libc = "0.2.191"
ref-cast = "1.0.27"
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync", "net", "fs", "io-util"] }
unicode-segmentation = "1"
unicode-width = "0.2.2"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dev-dependencies]
tempfile = "3.27.0"
vt100 = "0.16.2"
